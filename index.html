      STORY: The evaluator sees the finished plan, presses Replay, and watches source removal and first-fit packing happen step by step under numbered captions. The student exports the plan.
      FIRST VIEWPORT: Frame header with the tabs, then a control strip (rank key, transport, CSV), then the caption bar, then the full-width board of semester columns with the tray/key on its left.
